<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Hockey Dynasty</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Persistent Header (Only shown when you actually have a team) -->
    <header id="main-header" class="hidden">
        <h1>College Hockey Dynasty</h1>
        <div id="team-info" class="team-badge">No Team Assigned</div>
    </header>

    <main>
        <!-- 1. MAIN MENU SCREEN -->
        <section id="view-main-menu" class="view">
            <div class="dashboard-panel text-center">
                <h2>College Hockey Dynasty</h2>
                <p>Build your legacy.</p>
                <button id="btn-new-game">New Career</button>
                <button id="btn-load-game" class="secondary">Load Game</button>
            </div>
        </section>

        <!-- 2. COACH CREATION SCREEN -->
        <section id="view-coach-creation" class="view hidden">
            <div class="dashboard-panel">
                <h2>Create Your Coach</h2>
                <label>First Name:</label>
                <input type="text" id="coach-first" placeholder="e.g. Herb" class="input-field">
                
                <label>Last Name:</label>
                <input type="text" id="coach-last" placeholder="e.g. Brooks" class="input-field">
                
                <label>Starting Age (25 - 65):</label>
                <input type="number" id="coach-age" value="35" min="25" max="65" class="input-field">
                
                <p>Starting Skill Points: <span id="points-remaining">3</span></p>
                <!-- We will add the skill tree +/- buttons here later -->

                <button id="btn-submit-coach">View Job Offers</button>
            </div>
        </section>

        <!-- 3. JOB BOARD SCREEN -->
        <section id="view-job-board" class="view hidden">
            <div class="dashboard-panel">
                <h2>Available Head Coach Positions</h2>
                <p>Select a program to begin your career.</p>
                <ul id="job-list">
                    <!-- Populated by JS -->
                </ul>
            </div>
        </section>

        <!-- 4. IN-SEASON DASHBOARD SCREEN -->
        <section id="view-dashboard" class="view hidden">
            <div class="dashboard-panel">
                <h2>Team Dashboard</h2>
                <p>Welcome to the season.</p>
                <!-- Temporary buttons to show future layout -->
                <button class="menu-btn">View Roster</button>
                <button class="menu-btn">View Schedule</button>
                <button class="menu-btn">Advance Week</button>
            </div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
