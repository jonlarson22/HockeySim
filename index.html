<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Hockey Dynasty</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Persistent header. Shown once a career has a team; managed by the router. -->
    <header id="main-header" class="hidden">
        <h1>College Hockey Dynasty</h1>
        <div id="team-info" class="team-badge">No Team Assigned</div>
    </header>

    <!-- Screens can render overlays here -->
    <div id="modal-root"></div>

    <main>
        <!-- The active screen renders here. One screen at a time, no hide/show. -->
        <div id="app"></div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
